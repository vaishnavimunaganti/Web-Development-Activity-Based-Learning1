
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Explore Movie Genres</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="genres">
        <h1>Explore Genres</h1>
        <p>Discover movies according to your favourite genre.</p>
         <section class="section" id="genres">
        <p class="genre-list">
            Action | Comedy | Romance | Thriller | Sci-Fi
        </section>
        <div class="genre-container">
            <div class="genre-card action">
                <h2>Action</h2>
            </div>
            <div class="genre-card comedy">
                <h2>Comedy</h2>
            </div>
            <div class="genre-card romance">
                <h2>Romance</h2>
            </div>
            <div class="genre-card thriller">
                <h2>Thriller</h2>
            </div>
            <div class="genre-card scifi">
                <h2>Sci-Fi</h2>
            </div>
            <div class="genre-card horror">
                <h2>Horror</h2>
            </div>
        </div>
    </section>
</body>
</html>
